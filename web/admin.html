<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>설정</title>
<style>
  body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 24px; max-width: 500px; margin: auto; }
  input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
  button { padding: 10px 16px; margin: 8px 4px 8px 0; cursor: pointer; }
  #status { margin-top: 12px; padding: 8px; background: #222; border-radius: 4px; min-height: 20px; }
  a { color: #7fd1ff; }
</style>
</head>
<body>

<h2>⚙️ 설정</h2>
<p><a href="/">← 그래프 화면으로 돌아가기</a></p>

<h3>Gemini API 키</h3>
<p id="key-status">확인 중...</p>
<input type="password" id="api-key" placeholder="여기에 Gemini API 키 입력">
<button onclick="saveKey()">저장</button>

<h3>방어전략 재생성</h3>
<p>저장된 API 키로 위험 노드들의 방어전략을 새로 생성합니다.</p>
<button onclick="regenerate()">방어전략 재생성 실행</button>

<div id="status"></div>

<script>
async function checkKeyStatus() {
  const res = await fetch('/api/settings');
  const data = await res.json();
  document.getElementById('key-status').textContent = data.gemini_api_key_set
    ? `현재 저장된 키: ${data.gemini_api_key_masked}`
    : '저장된 키가 없습니다.';
}

async function saveKey() {
  const key = document.getElementById('api-key').value;
  if (!key) { alert('키를 입력해주세요'); return; }
  await fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ gemini_api_key: key })
  });
  document.getElementById('status').textContent = '키가 저장되었습니다.';
  checkKeyStatus();
}

async function regenerate() {
  document.getElementById('status').textContent = '생성 중... (수십 초 정도 걸릴 수 있습니다)';
  try {
    const res = await fetch('/api/admin/regenerate-defense', { method: 'POST' });
    const data = await res.json();
    document.getElementById('status').textContent = `완료! ${data.count}개 노드 방어전략 생성됨.`;
  } catch (e) {
    document.getElementById('status').textContent = '오류 발생: ' + e;
  }
}

checkKeyStatus();
</script>
</body>
</html>
