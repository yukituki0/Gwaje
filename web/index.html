<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>동적 공격 그래프 시각화</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  body { margin: 0; font-family: sans-serif; background: #1a1a2e; color: #eee; }
  #network { width: 100%; height: 85vh; border-bottom: 1px solid #444; }
  #panel { padding: 16px; min-height: 20vh; }
  #panel h3 { margin-top: 0; }
  .legend { padding: 8px 16px; font-size: 13px; }
  .legend span { margin-right: 16px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
  ul { padding-left: 18px; }
</style>
</head>
<body>

<div class="legend">
  <div style="padding: 4px 16px;"><a href="/admin.html" style="color:#7fd1ff;">⚙️ 설정</a></div>
  <span><span class="dot" style="background:#2ecc71"></span>낮음 (&lt;0.3)</span>
  <span><span class="dot" style="background:#f1c40f"></span>중간 (0.3~0.7)</span>
  <span><span class="dot" style="background:#e74c3c"></span>높음 (&gt;0.7)</span>
  <span>굵은 테두리 = 공격 경로 상 노드</span>
</div>

<div id="network"></div>
<div id="panel"><p>노드를 클릭하면 방어전략이 여기 표시됩니다.</p></div>

<script>
async function main() {
  const graphRes = await fetch('/api/graph');
  const graph = await graphRes.json();

  const analysisRes = await fetch('/api/analysis');
  const analysis = await analysisRes.json();

  const pathSet = new Set(analysis.attack_path);

  function riskColor(score) {
    if (score >= 0.7) return '#e74c3c';
    if (score >= 0.3) return '#f1c40f';
    return '#2ecc71';
  }

  const nodes = new vis.DataSet(graph.nodes.map(n => {
    const risk = analysis.risk_scores[n.id] ?? 0;
    const onPath = pathSet.has(n.id);
    return {
      id: n.id,
      label: n.id,
      color: { background: riskColor(risk), border: onPath ? '#ffffff' : '#555' },
      borderWidth: onPath ? 4 : 1,
      font: { color: '#fff' },
    };
  }));

  const edges = new vis.DataSet(graph.edges.map(e => {
    const onPath = pathSet.has(e.source) && pathSet.has(e.target);
    return {
      from: e.source,
      to: e.target,
      arrows: 'to',
      color: onPath ? { color: '#ffffff' } : { color: '#555' },
      width: onPath ? 3 : 1,
    };
  }));

  const container = document.getElementById('network');
  const network = new vis.Network(container, { nodes, edges }, {
    physics: {
      stabilization: { iterations: 200 },
      barnesHut: {
        gravitationalConstant: -8000,   // 노드끼리 더 세게 밀어냄
        springLength: 150,               // 엣지 길이 더 길게
        springConstant: 0.02,
        damping: 0.4,
      },
    },
    layout: { improvedLayout: true },
    nodes: {
      font: { size: 12 },
      scaling: { min: 10, max: 30 },
    },
    edges: {
      smooth: { type: 'continuous' },
    },
    interaction: {
      zoomView: true,
      dragView: true,
    },
  });

  const panel = document.getElementById('panel');
  const defaultPanelContent = '<p>노드를 클릭하면 방어전략이 여기 표시됩니다.</p>';

  function escapeHtml(value) {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function actionList(actions) {
    return `<ul>${actions.map(action => `<li>${escapeHtml(action)}</li>`).join('')}</ul>`;
  }

  network.on('click', params => {
    if (params.nodes.length === 0) {
      panel.innerHTML = defaultPanelContent;
      return;
    }

    const nodeId = String(params.nodes[0]);
    const strategy = analysis.defense_strategies?.[nodeId];
    if (!strategy || strategy.status === 'not_generated' || !strategy.summary) {
      panel.innerHTML = `<h3>노드 ${escapeHtml(nodeId)}</h3><p>사전 생성된 방어전략이 없습니다</p>`;
      return;
    }

    const immediateActions = Array.isArray(strategy.immediate_actions) ? strategy.immediate_actions : [];
    const longTermActions = Array.isArray(strategy.long_term_actions) ? strategy.long_term_actions : [];
    const additionalNotes = strategy.additional_notes
      ? `<h4>추가 참고사항</h4><p>${escapeHtml(strategy.additional_notes)}</p>`
      : '';

    panel.innerHTML = `
      <h3>노드 ${escapeHtml(nodeId)} 방어전략</h3>
      <p>${escapeHtml(strategy.summary)}</p>
      <h4>즉시 조치</h4>
      ${actionList(immediateActions)}
      <h4>장기 조치</h4>
      ${actionList(longTermActions)}
      ${additionalNotes}
    `;
  });
}

main();
</script>
</body>
</html>
