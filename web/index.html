<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>동적 공격 그래프 시각화</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --background: #101322;
    --surface: #191d31;
    --surface-light: #222740;
    --border: #343a58;
    --text: #f2f4ff;
    --muted: #aeb5d0;
    --accent: #7fd1ff;
  }
  * { box-sizing: border-box; }
  body {
    display: flex;
    flex-direction: column;
    margin: 0;
    height: 100vh;
    min-width: 320px;
    overflow: hidden;
    font-family: Inter, Pretendard, "Noto Sans KR", sans-serif;
    background: var(--background);
    color: var(--text);
  }
  .app-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    background: #14182a;
  }
  .header-top, .stats, .view-switcher, .legend, .node-meta {
    display: flex;
    align-items: center;
  }
  .header-top { justify-content: space-between; gap: 20px; }
  .title-block h1 { margin: 0; font-size: 24px; }
  .title-block p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .view-switcher { gap: 8px; flex-shrink: 0; }
  .view-button {
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-light);
    color: var(--text);
    text-decoration: none;
    font: inherit;
    cursor: pointer;
  }
  .view-button.active { border-color: var(--accent); color: var(--accent); }
  .settings-button { margin-left: 4px; }
  .stats { gap: 12px; margin-top: 18px; }
  .stat-card {
    min-width: 130px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
  }
  .stat-label { display: block; color: var(--muted); font-size: 12px; }
  .stat-value { display: block; margin-top: 5px; font-size: 21px; font-weight: 700; }
  .legend { flex-wrap: wrap; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 13px; }
  .dot { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; }
  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 4fr) minmax(300px, 1fr);
    gap: 16px;
    padding: 16px;
    flex: 1;
    min-height: 0;
    align-items: stretch;
  }
  .graph-card, #panel {
    overflow: hidden;
    height: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }
  .section-heading {
    margin: 0;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
  }
  #network { width: 100%; height: calc(100% - 48px); min-height: 0; }
  #panel {
    overflow-y: auto;
  }
  .panel-content { padding: 18px; }
  #panel h3 { margin: 0 0 12px; }
  #panel h4 { margin: 22px 0 8px; color: #d9def2; }
  #panel p { color: #d4d9eb; line-height: 1.65; }
  #panel ul { padding-left: 20px; color: #d4d9eb; }
  #panel li { margin-bottom: 8px; line-height: 1.5; }
  .node-meta { flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .meta-chip { padding: 5px 8px; border-radius: 6px; background: var(--surface-light); color: var(--muted); font-size: 12px; }
  .empty-state { margin: 0; color: var(--muted); }
  @media (max-width: 900px) {
    body { display: block; height: auto; overflow: auto; }
    .header-top { align-items: flex-start; flex-direction: column; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat-card { min-width: 0; }
    .workspace { grid-template-columns: 1fr; }
    .graph-card, #panel { height: auto; }
    #network { height: 65vh; min-height: 440px; }
    #panel { max-height: none; }
  }
  @media (max-width: 520px) {
    .app-header { padding: 16px; }
    .workspace { padding: 10px; }
    .view-switcher { width: 100%; }
    .view-button { flex: 1; text-align: center; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <div class="title-block">
      <h1>동적 공격 그래프</h1>
      <p>GAT 위험도와 Dijkstra 공격 경로를 기반으로 네트워크 위험을 분석합니다.</p>
    </div>
    <nav class="view-switcher" aria-label="보기 전환">
      <button class="view-button active" type="button" data-edge-mode="path" aria-pressed="true">공격 경로</button>
      <button class="view-button" type="button" data-edge-mode="selected" aria-pressed="false">선택 노드</button>
      <button class="view-button" type="button" data-edge-mode="all" aria-pressed="false">전체 네트워크</button>
      <a class="view-button settings-button" href="/admin.html">설정</a>
    </nav>
  </div>
  <div class="stats" aria-label="핵심 통계">
    <div class="stat-card"><span class="stat-label">전체 노드 수</span><strong class="stat-value" id="node-count">-</strong></div>
    <div class="stat-card"><span class="stat-label">전체 엣지 수</span><strong class="stat-value" id="edge-count">-</strong></div>
    <div class="stat-card"><span class="stat-label">고위험 노드 수</span><strong class="stat-value" id="high-risk-count">-</strong></div>
    <div class="stat-card"><span class="stat-label">공격 경로 길이</span><strong class="stat-value" id="path-length">-</strong></div>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:#2ecc71"></span>낮음 (&lt;0.3)</span>
    <span><span class="dot" style="background:#f1c40f"></span>중간 (0.3~0.7)</span>
    <span><span class="dot" style="background:#e74c3c"></span>높음 (&gt;0.7)</span>
    <span>굵은 테두리 = 공격 경로 상 노드</span>
  </div>
</header>

<main class="workspace">
  <section class="graph-card" aria-labelledby="graph-title">
    <h2 class="section-heading" id="graph-title">공격 그래프</h2>
    <div id="network"></div>
  </section>
  <aside id="panel" aria-labelledby="panel-title">
    <h2 class="section-heading" id="panel-title">선택 노드 상세정보 및 방어전략</h2>
    <div class="panel-content"><p class="empty-state">노드를 클릭하면 상세정보와 방어전략이 표시됩니다.</p></div>
  </aside>
</main>

<script>
async function main() {
  const graphRes = await fetch('/api/graph');
  const graph = await graphRes.json();

  const analysisRes = await fetch('/api/analysis');
  const analysis = await analysisRes.json();

  const pathSet = new Set(analysis.attack_path);
  const pathEdgeSet = new Set(
    analysis.attack_path.slice(0, -1).map((nodeId, index) => `${nodeId}->${analysis.attack_path[index + 1]}`)
  );
  const highRiskCount = Object.values(analysis.risk_scores).filter(score => score >= 0.7).length;

  document.getElementById('node-count').textContent = graph.nodes.length.toLocaleString();
  document.getElementById('edge-count').textContent = graph.edges.length.toLocaleString();
  document.getElementById('high-risk-count').textContent = highRiskCount.toLocaleString();
  document.getElementById('path-length').textContent = `${analysis.attack_path.length}개 노드`;

  function riskColor(score) {
    if (score >= 0.7) return '#e74c3c';
    if (score >= 0.3) return '#f1c40f';
    return '#2ecc71';
  }

  const nodes = new vis.DataSet(graph.nodes.map(n => {
    const risk = analysis.risk_scores[n.id] ?? 0;
    const onPath = pathSet.has(n.id);
    return {
      id: n.id,
      label: n.id,
      color: { background: riskColor(risk), border: onPath ? '#ffffff' : '#555' },
      borderWidth: onPath ? 4 : 1,
      font: { color: '#fff' },
    };
  }));

  const edgeRecords = graph.edges.map((e, index) => {
    const source = String(e.source);
    const target = String(e.target);
    const onPath = pathEdgeSet.has(`${source}->${target}`);
    return {
      id: `edge-${index}`,
      source,
      target,
      onPath,
    };
  });

  function edgeStyle(edge, mode, selectedNodeId = null) {
    if (mode === 'selected') {
      const isConnected = edge.source === selectedNodeId || edge.target === selectedNodeId;
      return {
        color: { color: isConnected ? '#7fd1ff' : 'rgba(0, 0, 0, 0)' },
        width: isConnected ? 2.5 : 0.1,
      };
    }
    if (mode === 'all') {
      return {
        color: { color: edge.onPath ? '#ffffff' : 'rgba(120, 130, 165, 0.16)' },
        width: edge.onPath ? 3 : 0.6,
      };
    }
    return {
      color: { color: edge.onPath ? '#ffffff' : 'rgba(120, 130, 165, 0.015)' },
      width: edge.onPath ? 3 : 0.2,
    };
  }

  const edges = new vis.DataSet(edgeRecords.map(edge => {
    const style = edgeStyle(edge, 'path');
    return {
      id: edge.id,
      from: edge.source,
      to: edge.target,
      arrows: 'to',
      ...style,
    };
  }));

  const container = document.getElementById('network');
  const network = new vis.Network(container, { nodes, edges }, {
    physics: {
      stabilization: { iterations: 200 },
      barnesHut: {
        gravitationalConstant: -8000,   // 노드끼리 더 세게 밀어냄
        springLength: 150,               // 엣지 길이 더 길게
        springConstant: 0.02,
        damping: 0.4,
      },
    },
    layout: { improvedLayout: true },
    nodes: {
      font: { size: 12 },
      scaling: { min: 10, max: 30 },
    },
    edges: {
      smooth: { type: 'continuous' },
    },
    interaction: {
      zoomView: true,
      dragView: true,
    },
  });

  const panel = document.getElementById('panel');
  const defaultPanelContent = '<div class="panel-content"><p class="empty-state">노드를 클릭하면 상세정보와 방어전략이 표시됩니다.</p></div>';
  const modeButtons = [...document.querySelectorAll('[data-edge-mode]')];
  let edgeMode = 'path';
  let selectedNodeId = null;

  function applyEdgeMode(mode) {
    edgeMode = mode;
    if (mode !== 'selected') network.unselectAll();
    edges.update(edgeRecords.map(edge => ({
      id: edge.id,
      ...edgeStyle(edge, mode, selectedNodeId),
    })));
    modeButtons.forEach(button => {
      const isActive = button.dataset.edgeMode === mode;
      button.classList.toggle('active', isActive);
      button.setAttribute('aria-pressed', String(isActive));
    });
  }

  modeButtons.forEach(button => {
    button.addEventListener('click', () => applyEdgeMode(button.dataset.edgeMode));
  });

  function escapeHtml(value) {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function actionList(actions) {
    return `<ul>${actions.map(action => `<li>${escapeHtml(action)}</li>`).join('')}</ul>`;
  }

  network.on('click', params => {
    if (params.nodes.length === 0) {
      panel.innerHTML = defaultPanelContent;
      selectedNodeId = null;
      if (edgeMode === 'selected') applyEdgeMode('path');
      return;
    }

    const nodeId = String(params.nodes[0]);
    selectedNodeId = nodeId;
    applyEdgeMode('selected');
    const node = graph.nodes.find(item => String(item.id) === nodeId);
    const risk = analysis.risk_scores[nodeId] ?? 0;
    const nodeDetails = `
      <div class="node-meta">
        <span class="meta-chip">유형: ${escapeHtml(node?.zone ?? '알 수 없음')}</span>
        <span class="meta-chip">위험도: ${escapeHtml(Number(risk).toFixed(4))}</span>
        <span class="meta-chip">공격 경로: ${pathSet.has(nodeId) ? '포함' : '미포함'}</span>
      </div>
    `;
    const strategy = analysis.defense_strategies?.[nodeId];
    if (!strategy || strategy.status === 'not_generated' || !strategy.summary) {
      panel.innerHTML = `<h2 class="section-heading">선택 노드 상세정보 및 방어전략</h2><div class="panel-content"><h3>노드 ${escapeHtml(nodeId)}</h3>${nodeDetails}<p>사전 생성된 방어전략이 없습니다</p></div>`;
      return;
    }

    const immediateActions = Array.isArray(strategy.immediate_actions) ? strategy.immediate_actions : [];
    const longTermActions = Array.isArray(strategy.long_term_actions) ? strategy.long_term_actions : [];
    const additionalNotes = strategy.additional_notes
      ? `<h4>추가 참고사항</h4><p>${escapeHtml(strategy.additional_notes)}</p>`
      : '';

    panel.innerHTML = `
      <h2 class="section-heading">선택 노드 상세정보 및 방어전략</h2>
      <div class="panel-content">
        <h3>노드 ${escapeHtml(nodeId)}</h3>
        ${nodeDetails}
        <h4>방어전략 요약</h4>
        <p>${escapeHtml(strategy.summary)}</p>
        <h4>즉시 조치</h4>
        ${actionList(immediateActions)}
        <h4>장기 조치</h4>
        ${actionList(longTermActions)}
        ${additionalNotes}
      </div>
    `;
  });
}

main();
</script>
</body>
</html>
